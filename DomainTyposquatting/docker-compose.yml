services:
  # === PostgreSQL Database ===
  # Shared database for all services. Same engine locally and on Azure
  # (Azure Database for PostgreSQL Flexible Server).
  # Port 5432
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-typosquatting}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - typosquatting-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === pgAdmin - Database Debug UI ===
  # Browse tables, run queries, inspect data visually
  # Port 5050 - http://localhost:5050
  # Login: admin@admin.com / admin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - typosquatting-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # === DNSTwist Scan Engine ===
  # The core scanning API that runs dnstwist fuzzing algorithms
  # Port 8000 - Docs at http://localhost:8000/docs
  dnstwist-api:
    build: ./dnstwist-api
    container_name: dnstwist-api
    ports:
      - "8000:8000"
    networks:
      - typosquatting-net
    restart: unless-stopped

  # === Orchestrator API ===
  # Central hub: unified domain DB, scans via dnstwist, enriches via who-dat
  # Port 8001 - Docs at http://localhost:8001/docs
  orchestrator-api:
    build: ./orchestrator-api
    container_name: orchestrator-api
    ports:
      - "8001:8001"
    environment:
      - DNSTWIST_API_URL=${DNSTWIST_API_URL:-http://dnstwist-api:8000}
      - WHO_DAT_URL=${WHO_DAT_URL:-http://who-dat:8080}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/typosquatting}
    networks:
      - typosquatting-net
    depends_on:
      postgres:
        condition: service_healthy
      dnstwist-api:
        condition: service_started
      who-dat:
        condition: service_started
    restart: unless-stopped

  # === WhoisDS NRD API ===
  # Downloads and searches Newly Registered Domains
  # Writes matched domains directly to PostgreSQL, enriches via who-dat
  # Port 8002 - Docs at http://localhost:8002/docs
  whoisds-api:
    build: ./whoisds-api
    container_name: whoisds-api
    ports:
      - "8002:8002"
    environment:
      - DATA_DIR=/data/whoisds
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/typosquatting}
      - WHO_DAT_URL=${WHO_DAT_URL:-http://who-dat:8080}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator-api:8001}
      - WHOISDS_EMAIL=${WHOISDS_EMAIL:-}
      - WHOISDS_PASSWORD=${WHOISDS_PASSWORD:-}
    volumes:
      # Bind-mount NRD files to host so they persist across rebuilds
      # On Azure: swap this for an Azure Files share or BlobFuse mount
      - ./InstalledNRD:/data/whoisds/nrd-files
    networks:
      - typosquatting-net
    depends_on:
      postgres:
        condition: service_healthy
      who-dat:
        condition: service_started
    restart: unless-stopped

  # === Who-Dat WHOIS/RDAP API ===
  # Built from local source (Go app with WHOIS + RDAP fallback)
  # Port 8080 - Usage: GET http://localhost:8080/{domain}
  #           - Multi:  GET http://localhost:8080/multi?domains=a.com,b.com
  who-dat:
    build: ./who-dat
    container_name: who-dat
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - typosquatting-net
    restart: unless-stopped

  # === Dashboard API ===
  # Read/write gateway between the Vue frontend and PostgreSQL.
  # Does NOT call the processing backend — only reads/writes the shared DB.
  # Port 8003 - Docs at http://localhost:8003/docs
  frontend-api:
    build: ./frontend-api
    container_name: frontend-api
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/typosquatting}
    networks:
      - typosquatting-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # === Dashboard Frontend ===
  # Vue 3 + PrimeVue SPA served by nginx.
  # Proxies /api/* to frontend-api internally.
  # Port 3000 - http://localhost:3000/?customers=CustomerName
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    networks:
      - typosquatting-net
    depends_on:
      - frontend-api
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  typosquatting-net:
    driver: bridge
