version: "3.8"

services:
  # === DNSTwist Scan Engine ===
  # The core scanning API that runs dnstwist fuzzing algorithms
  # Port 8000 - Docs at http://localhost:8000/docs
  dnstwist-api:
    build: ./dnstwist-api
    container_name: dnstwist-api
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${DNSTWIST_API_KEY:-changeme}
      - CALLBACK_URL=${CALLBACK_URL:-http://orchestrator-api:8001/api/callback}
      - CALLBACK_METHOD=${CALLBACK_METHOD:-POST}
      - CALLBACK_API_KEY=${CALLBACK_API_KEY:-}
      - CALLBACK_API_KEY_HEADER=${CALLBACK_API_KEY_HEADER:-X-API-Key}
      - CALLBACK_BEARER_TOKEN=${CALLBACK_BEARER_TOKEN:-}
      - CALLBACK_BASIC_USER=${CALLBACK_BASIC_USER:-}
      - CALLBACK_BASIC_PASS=${CALLBACK_BASIC_PASS:-}
      - CALLBACK_CUSTOM_HEADER=${CALLBACK_CUSTOM_HEADER:-}
      - CALLBACK_CUSTOM_VALUE=${CALLBACK_CUSTOM_VALUE:-}
    networks:
      - typosquatting-net
    restart: unless-stopped

  # === Orchestrator API ===
  # Central hub: unified domain DB, receives callbacks, calls who-dat
  # Port 8001 - Docs at http://localhost:8001/docs
  orchestrator-api:
    build: ./orchestrator-api
    container_name: orchestrator-api
    ports:
      - "8001:8001"
    environment:
      - DNSTWIST_API_URL=${DNSTWIST_API_URL:-http://dnstwist-api:8000}
      - DNSTWIST_API_KEY=${DNSTWIST_API_KEY:-changeme}
      - WHO_DAT_URL=${WHO_DAT_URL:-http://who-dat:8080}
      - DATA_DIR=/data/dnstwist-results
      - DB_PATH=/data/dnstwist-results/domains.db
    volumes:
      - dnstwist-data:/data/dnstwist-results
    networks:
      - typosquatting-net
    depends_on:
      - dnstwist-api
      - who-dat
    restart: unless-stopped

  # === WhoisDS NRD API ===
  # Downloads and searches Newly Registered Domains
  # NRD files are bind-mounted to ./InstalledNRD so they survive rebuilds
  # Port 8002 - Docs at http://localhost:8002/docs
  whoisds-api:
    build: ./whoisds-api
    container_name: whoisds-api
    ports:
      - "8002:8002"
    environment:
      - DATA_DIR=/data/whoisds
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator-api:8001}
    volumes:
      # Bind-mount NRD files to host so they persist across rebuilds
      # On Azure: swap this for an Azure Files share or BlobFuse mount
      - ./InstalledNRD:/data/whoisds/nrd-files
      - whoisds-data:/data/whoisds/matched-results
    networks:
      - typosquatting-net
    depends_on:
      - orchestrator-api
    restart: unless-stopped

  # === Who-Dat WHOIS/RDAP API ===
  # Built from local source (Go app with WHOIS + RDAP fallback)
  # Port 8080 - Usage: GET http://localhost:8080/{domain}
  #           - Multi:  GET http://localhost:8080/multi?domains=a.com,b.com
  who-dat:
    build: ./who-dat
    container_name: who-dat
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - typosquatting-net
    restart: unless-stopped

volumes:
  dnstwist-data:
    driver: local
  whoisds-data:
    driver: local

networks:
  typosquatting-net:
    driver: bridge
